# Renatka armrest-console map for the Renault Scenic III / Megane.
#
# The built-in defaults already match this console, so you only need this file
# to change a control. Copy it to the SD-card root as  cswmap.ini  and edit.
# It is re-read within 5 seconds, no reboot needed.
#
# Enable the reader with an empty file named  csw  in the SD-card root.
# ---------------------------------------------------------------------------
# Buttons: btn1..btn9. Only `src` is usable for these records; the other
# bytes carry uninitialised data, so one line per button is enough.
#
#   btn1=top-left soft key      btn2=back        btn3=top-right soft key
#   btn4=info                   btn5=menu        btn6=light
#   btn7=repeat                 btn8=dest        btn9=map
#
# Joystick: dir1=up dir2=down dir3=right dir4=left
# Knob: rot1=anticlockwise, rot2=clockwise (zoom on the map, list movement
#       elsewhere). push=knob press.
#
# Actions: up down left right enter ok back esc map menu zoomin sr
#          knob+ knob- none
# Use `none` to swallow a key without doing anything.
# `longpush` is accepted for compatibility but not implemented: the record
# stream has no release event, so a hold cannot be told from a tap.
# ---------------------------------------------------------------------------

# --- console buttons (defaults shown; uncomment to change) -----------------
# btn1=esc          # top-left soft key: zoom out / delete character
# btn2=back
# btn3=sr           # top-right soft key: zoom in / next field
# btn4=enter        # info: ETA on the map
# btn5=menu
# btn6=none         # light
# btn7=none         # repeat
# btn8=menu         # dest
# btn9=map

# --- joystick --------------------------------------------------------------
# dir1=up
# dir2=down
# dir3=right
# dir4=left

# --- rotary knob -----------------------------------------------------------
# rot1=knob-        # anticlockwise
# rot2=knob+        # clockwise
# push=enter

# --- escape hatch ----------------------------------------------------------
# If a record is logged as UNMAPPED, add it directly:
# src=7 dir=5 act=menu
